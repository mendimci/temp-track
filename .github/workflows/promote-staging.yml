name: promote-staging

on:
  schedule:
    - cron: "0 5 * * 1-5"   # 05:00 UTC, Monday to Friday
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: promote-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix scripts

      - name: Check readiness
        id: ready
        run: |
          host=$(node scripts/project-config.mjs environments.staging.host)
          if [ ! -f Dockerfile ] || [ -z "$host" ]; then
            echo "::notice::No Dockerfile or project.yaml on main yet; skipping Staging deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$host" != "portainer" ]; then
            echo "::error::Staging host '$host' has no deploy step yet; the devops-engineer must add one."
            exit 1
          fi
          {
            echo "url=$(node scripts/project-config.mjs environments.staging.url)"
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - if: steps.ready.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: steps.ready.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.ready.outputs.image }}:staging
            ${{ steps.ready.outputs.image }}:${{ steps.ready.outputs.sha }}

      - name: Trigger Portainer stack webhook
        if: steps.ready.outputs.skip != 'true'
        env:
          WEBHOOK: ${{ secrets.PORTAINER_STAGING_WEBHOOK }}
        run: curl -fsS -X POST "$WEBHOOK"

      - name: Health check
        if: steps.ready.outputs.skip != 'true'
        run: bash scripts/health-check.sh "${{ steps.ready.outputs.url }}"
